kind = "web"
previewPath = "/"
title = "Soko Moto"
version = "1.0.0"
id = "artifacts/soko-moto"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22635

[services.development]
run = "pnpm --filter @workspace/soko-moto run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/soko-moto", "run", "build" ]
publicDir = "artifacts/soko-moto/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22635"
BASE_PATH = "/"
